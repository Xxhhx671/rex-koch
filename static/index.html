<div id="app">
  <!-- Экран входа -->
  <section id="auth-view" class="hidden">
    <div class="auth-card glass">
      <div class="brand">
        <svg class="brand-logo"><use href="#i-logo"/></svg>
        <h1>Kofi</h1>
        <p>Мессенджер для своих</p>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="login">Вход</button>
        <button class="tab" data-tab="register">Регистрация</button>
      </div>

      <form id="login-form" class="auth-form">
        <input name="login" placeholder="Ник или почта" autocomplete="username" required>
        <input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
        <button class="btn primary" type="submit">Войти</button>
      </form>

      <form id="register-form" class="auth-form hidden">
        <input name="username" placeholder="Ник (3-30 символов, латиница)" autocomplete="username" required>
        <input name="name" placeholder="Ваше имя" autocomplete="name">
        <input name="email" type="email" placeholder="Почта" autocomplete="email" required>
        <input name="password" type="password" placeholder="Пароль (от 6 символов)" autocomplete="new-password" required>
        <button class="btn primary" type="submit">Создать аккаунт</button>
      </form>

      <p id="auth-error" class="error hidden"></p>
    </div>
  </section>

  <!-- Приложение -->
  <section id="main-view" class="hidden">
    <div class="scrim" id="scrim"></div>

    <nav class="drawer glass" id="drawer">
      <div class="drawer-head glass" id="drawer-user"></div>
      <div class="drawer-nav">
        <button data-mode="newchat"><svg><use href="#i-pencil"/></svg><span>Новое сообщение</span></button>
        <button data-mode="saved"><svg><use href="#i-star"/></svg><span>Избранное</span></button>
        <button data-mode="group"><svg><use href="#i-users"/></svg><span>Новая группа</span></button>
        <button data-mode="channel"><svg><use href="#i-channel"/></svg><span>Новый канал</span></button>
        <button data-mode="settings"><svg><use href="#i-settings"/></svg><span>Настройки</span></button>
      </div>
      <div class="drawer-foot">
        <button data-mode="logout" class="danger-item"><svg><use href="#i-logout"/></svg><span>Выйти из аккаунта</span></button>
      </div>
    </nav>

    <aside class="sidebar glass" id="sidebar">
      <header class="sb-top">
        <button class="icon-btn ghost" id="menu-btn" title="Меню"><svg><use href="#i-menu"/></svg></button>
        <div class="sb-title" id="sb-title">Чаты</div>
        <button class="icon-btn ghost" id="new-btn" title="Новый чат"><svg><use href="#i-pencil"/></svg></button>
      </header>

      <div class="sb-search" id="sb-search">
        <svg><use href="#i-search"/></svg>
        <input id="search-input" placeholder="Поиск" autocomplete="off" spellcheck="false">
        <button class="clear-search hidden" id="clear-search" title="Очистить"><svg><use href="#i-x"/></svg></button>
      </div>

      <div class="stories-bar hidden" id="stories-bar"></div>
      <nav class="folder-tabs hidden" id="folder-tabs"></nav>

      <div class="sb-body" id="list-body"></div>
    </aside>

    <main class="content" id="conv">
      <div class="conv-empty" id="conv-empty">
        <svg><use href="#i-msg"/></svg>
        <p>Выберите чат,<br>чтобы начать общение</p>
        <span>или нажмите <b>Новый чат</b> в списке слева</span>
      </div>

      <div class="conv-open hidden" id="conv-open">
        <header class="conv-head glass" id="conv-head"></header>
        <div class="pinned-bar hidden" id="pinned-bar"></div>
        <div class="msg-search hidden" id="msg-search">
          <div class="ms-input">
            <svg><use href="#i-search"/></svg>
            <input id="ms-q" placeholder="Поиск по сообщениям" autocomplete="off" spellcheck="false">
            <button class="icon-btn ghost" id="ms-close" type="button" title="Закрыть поиск"><svg><use href="#i-x"/></svg></button>
          </div>
          <div class="ms-results" id="ms-results"></div>
        </div>
        <div class="conv-body" id="conv-body"></div>
        <div class="attach-bar hidden" id="attach-bar">
          <svg><use href="#i-image"/></svg>
          <span id="attach-name"></span>
          <button type="button" id="attach-cancel" title="Убрать"><svg><use href="#i-x"/></svg></button>
        </div>
        <div class="blocked-bar hidden" id="blocked-bar">
          <svg><use href="#i-lock"/></svg>
          <span class="bb-text"><b>Заблокирован чат</b><small>Отправка сообщений отключена</small></span>
          <button class="btn ghost small" data-act="unblock">Разблокировать</button>
        </div>
        <div class="chat-bar hidden" id="chat-bar">
          <span class="cb-icon"><svg><use href="#i-channel"/></svg></span>
          <span class="cb-text"><b id="cb-title"></b><small id="cb-sub"></small></span>
          <button class="btn primary small" id="cb-action" type="button"></button>
        </div>
        <div class="rec-bar hidden" id="rec-bar">
          <span class="rec-dot"></span>
          <span class="rec-time" id="rec-time">0:00</span>
          <span class="rec-hint">Идёт запись…</span>
          <button class="btn ghost small" id="rec-cancel" type="button">Отмена</button>
          <button class="btn primary small" id="rec-send" type="button">Отправить</button>
        </div>
        <div class="reply-strip hidden" id="reply-strip"></div>
        <form class="conv-form glass" id="conv-form">
          <label class="icon-btn ghost" title="Прикрепить изображение">
            <svg><use href="#i-clip"/></svg>
            <input type="file" id="attach-input" accept="image/*" hidden>
          </label>
          <div class="input-pill">
            <textarea id="msg-input" rows="1" placeholder="Сообщение" maxlength="4000"></textarea>
          </div>
          <button class="icon-btn ghost" type="button" id="poll-btn" title="Создать опрос"><svg><use href="#i-poll"/></svg></button>
          <button class="icon-btn ghost mic-btn" type="button" id="mic-btn" title="Записать голосовое">
            <svg><use href="#i-mic"/></svg>
          </button>
          <button class="send-btn" type="submit" title="Отправить">
            <svg><use href="#i-send"/></svg>
          </button>
        </form>
      </div>
    </main>

    <!-- Профиль на весь экран -->
    <section class="profile-view hidden" id="profile-view">
      <header class="pv-head glass">
        <button class="icon-btn ghost" id="pv-back" title="Назад"><svg><use href="#i-back"/></svg></button>
        <b>Настройки</b>
        <span>Профиль Kofi</span>
      </header>
      <div class="pv-body" id="pv-body"></div>
    </section>
  </section>
</div>

<div class="ctx-menu hidden" id="ctx-menu"></div>
<div class="call-view hidden" id="call-view" aria-live="polite"></div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
